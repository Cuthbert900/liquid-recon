# Declarative (DB-less) Kong config — the single public entry point in
# front of GoTrue and PostgREST. Two consumers (anon / service_role) map
# straight onto the two API keys the app already understands from the
# .env.local pattern used for the AI provider keys: a public-ish anon key
# and a server-only service_role key that bypasses RLS.
#
# Faithful to Supabase's own self-hosting kong.yml, trimmed to the two
# services this app runs (auth, rest) plus postgres-meta for Studio.
_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # GoTrue's own routes that must stay unauthenticated (email confirmation
  # links, OAuth callbacks) — nothing here reads app data.
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths: ['/auth/v1/verify']
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths: ['/auth/v1/callback']
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths: ['/auth/v1/authorize']
    plugins:
      - name: cors

  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: ['/auth/v1/']
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: ['admin', 'anon']

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: ['/rest/v1/']
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: ['admin', 'anon']

  # postgres-meta powers Studio's table/schema browser — admin-only
  # (service_role), never exposed to the anon key.
  - name: meta
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths: ['/pg/']
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: ['admin']

# Local-dev / demo stack: the same self-hosted Supabase services as
# terraform/files/docker-compose.yml (db, auth, rest, meta, studio, kong),
# minus Caddy/TLS/Key Vault — plain HTTP on localhost instead — plus the
# Next.js app itself, containerized, so the whole thing mirrors the real
# production shape (app talks to Supabase over its public URL, not an
# internal service name — same as the Azure deployment, where the app and
# the Supabase VM are two separately-deployed things talking over
# `supabase_url`).
#
# Run from the repo root:
#   docker/generate-env.sh          # first time only — writes docker/.env
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#
# Then: apply supabase/migrations/0001_admin_schema.sql via Studio
# (http://localhost:8000/studio... actually Studio is on :3001 here, see
# below), create an admin user, and sign in at http://localhost:3000/admin/login.
# Full walkthrough in docker/README.md.

services:
  db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      # supabase_auth_admin/authenticator are "reserved roles" in this image
      # — ALTER ROLE on them is rejected ("only superusers can modify it")
      # for EVERY caller, including postgres itself, at any point (init-time
      # or after). The image's own migrate.sh demotes postgres mid-init and
      # does its own privileged work as supabase_admin instead, which is not
      # subject to that protection — and it has a documented hook for
      # exactly this: a file at /etc/postgresql.schema.sql, run as
      # supabase_admin right after migrations, specifically to "update role
      # passwords". Generated by generate-env.sh alongside docker/.env
      # (contains the real password in plaintext — gitignored, never commit).
      - ./postgresql-schema.sql:/etc/postgresql.schema.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: '${SITE_URL}/**'
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # No SMTP locally either — same auto-confirm shortcut as the Azure
      # stack until real SMTP is wired up (terraform/README.md).
      GOTRUE_MAILER_AUTOCONFIRM: 'true'

  rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:20241014-c083b3b
    restart: unless-stopped
    depends_on:
      - meta
      - kong
    ports:
      # Studio published directly (no Caddy locally) — separate port from
      # Kong's :8000 so it doesn't fight the API routes.
      - '3001:3000'
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DEFAULT_ORGANIZATION_NAME: 'Liquid Intelligent Technologies'
      DEFAULT_PROJECT_NAME: 'Netting Reconciliation (local)'

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - meta
    environment:
      KONG_DATABASE: 'off'
      # Kong reads its FINAL, substituted config from here — kong-entrypoint.sh
      # writes it at container start. kong.yml itself is mounted as
      # kong.yml.template instead (see entrypoint/volumes below): Kong (OSS,
      # this version) does not expand ${ANON_KEY}/${SERVICE_ROLE_KEY} placeholders
      # itself despite "_transform: true" — verified directly (Kong's own
      # container env had the right values; the deployed consumer credentials
      # were still the literal, unexpanded "${...}" strings, causing every
      # request to fail key-auth with 401 regardless of how correct the actual
      # keys were everywhere else in the stack).
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: '64 160k'
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: ['/home/kong/kong-entrypoint.sh']
    ports:
      # Published for the browser, which always needs the public address.
      # The app container below reaches Kong via the "kong:8000" in-network
      # name instead — see its own environment block for why.
      - '8000:8000'
    volumes:
      - ./kong.yml:/home/kong/kong.yml.template:ro
      - ./kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SITE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      - kong
    # NEXT_PUBLIC_SUPABASE_URL gets inlined into BOTH the browser bundle
    # and the server bundle at build time (Next.js doesn't distinguish
    # "server process" from "client bundle" for that inlining), baked in
    # above as ${SITE_URL} (http://localhost:8000) — correct for the
    # browser, which always needs the publicly-reachable address.
    #
    # This used to also be network_mode: host, so the server process could
    # resolve that same "localhost:8000" to Kong. That doesn't work
    # reliably on Docker Desktop (Mac/Windows) — verified directly: the
    # container reported itself "Ready" and listening on 0.0.0.0:3000, but
    # was unreachable both from the host AND from inside its own container
    # via wget, meaning Docker Desktop's host-networking emulation wasn't
    # actually proxying loopback connections correctly. Standard published
    # ports (below) are what Kong/Studio/db have used all along, proven
    # working throughout this setup — so the app now uses those too, on
    # the normal compose network, and reaches Kong via the "kong:8000"
    # in-network service name instead of "localhost:8000" server-side.
    # SUPABASE_URL (not NEXT_PUBLIC_-prefixed, so it's never inlined into
    # the client bundle) is what makes that split possible — see
    # getServerSupabaseUrl() in src/lib/supabase/config.ts.
    ports:
      - '3000:3000'
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'

volumes:
  supabase_db_data:
